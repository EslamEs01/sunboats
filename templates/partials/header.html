<header class="site-header sticky top-0 z-40 border-b border-ink/10 bg-paper/95 backdrop-blur-sm">
  <div class="site-header-inner mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3">
    <a href="{% url 'home' %}" class="min-w-0 leading-none">
      <span class="block font-display text-xl tracking-tight sm:text-[1.35rem]">{{ site_settings.site_name|default:"Sun Boats" }}</span>
      <span class="mt-0.5 block text-[11px] uppercase tracking-[0.14em] text-basalt/70">International Exhibitions</span>
    </a>

    <nav class="site-nav site-nav-desktop text-[12px] uppercase tracking-[0.16em] text-basalt" aria-label="Primary">
      <a href="{% url 'home' %}" {% if request.resolver_match and request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'exhibitions' %}" {% if request.resolver_match and request.resolver_match.url_name == 'exhibitions' or request.resolver_match and request.resolver_match.url_name == 'exhibition-detail' %}aria-current="page"{% endif %}>Exhibitions</a>
      <a href="{% url 'gallery' %}" {% if request.resolver_match and request.resolver_match.url_name == 'gallery' %}aria-current="page"{% endif %}>Gallery</a>
      <a href="{% url 'submit' %}" {% if request.resolver_match and request.resolver_match.url_name == 'submit' %}aria-current="page"{% endif %}>Submit your work</a>
      <a href="{% url 'about' %}" {% if request.resolver_match and request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
    </nav>

    <div class="nav-mobile">
      <button type="button" class="nav-toggle nav-icon-btn" id="nav-open" data-nav-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <svg class="nav-icon-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
        <svg class="nav-icon-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
      <nav id="mobile-menu" class="nav-dropdown" hidden>
        <a href="{% url 'home' %}" {% if request.resolver_match and request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 5l8 6.5V20H4z"/><path d="M10 20v-6h4v6"/></svg>
          Home
        </a>
        <a href="{% url 'exhibitions' %}" {% if request.resolver_match and request.resolver_match.url_name == 'exhibitions' or request.resolver_match and request.resolver_match.url_name == 'exhibition-detail' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 9h8M8 13h5"/></svg>
          Exhibitions
        </a>
        <a href="{% url 'gallery' %}" {% if request.resolver_match and request.resolver_match.url_name == 'gallery' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="m8 15 2.4-3 2.1 2.4L15 12l3.5 3"/></svg>
          Gallery
        </a>
        <a href="{% url 'submit' %}" {% if request.resolver_match and request.resolver_match.url_name == 'submit' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Submit your work
        </a>
        <a href="{% url 'about' %}" {% if request.resolver_match and request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg>
          About
        </a>
      </nav>
    </div>
  </div>
</header>
