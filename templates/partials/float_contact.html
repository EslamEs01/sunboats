{% if site_settings.phone_digits or site_settings.whatsapp_digits %}
  <div class="float-dock" aria-label="Contact">
    {% if site_settings.phone_digits %}
      <a class="float-btn float-call" href="{{ site_settings.tel_href }}" aria-label="Call Sun Boats">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6.5 4.5h3l1.2 3-1.8 1.1a12 12 0 0 0 6.5 6.5l1.1-1.8 3 1.2v3c0 .8-.7 1.5-1.5 1.5C9.6 19 5 14.4 5 8c0-.8.7-1.5 1.5-1.5Z"/>
        </svg>
      </a>
    {% endif %}
    {% if site_settings.whatsapp_digits %}
      <a class="float-btn float-wa" href="{{ site_settings.whatsapp_href }}" target="_blank" rel="noopener" aria-label="WhatsApp Sun Boats">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
          <path d="M12 3.2A8.3 8.3 0 0 0 5.2 16.1L4 20l4-1.1A8.3 8.3 0 1 0 12 3.2Zm4.7 11.8c-.2.5-1.1 1-1.6 1.1-.4.1-.9.2-2.9-.6-2.4-1-4-3.6-4.1-3.8-.1-.2-1-1.3-1-2.5s.6-1.8.9-2c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.8 2 .8 2.1.1.2.1.3 0 .5l-.3.5c-.1.2-.3.3-.1.6.1.2.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.8c.1-.2.3-.1.5-.1l1.6.8c.2.1.3.1.4.2.1.3 0 .8-.2 1.3Z"/>
        </svg>
      </a>
    {% endif %}
  </div>
{% endif %}
