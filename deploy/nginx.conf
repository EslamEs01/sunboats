# Install as /etc/nginx/sites-available/sunboats
# Domain only. Raw VPS IP is not a public site.

upstream sunboats_app {
    server 127.0.0.1:8000;
}

# Close requests that arrive on the IP or an unknown host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunboats.online www.sunboats.online;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.env {
        deny all;
        return 404;
    }

    location ^~ /.git {
        deny all;
        return 404;
    }

    location /static/ {
        alias /var/www/sunboats/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/sunboats/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://sunboats_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
